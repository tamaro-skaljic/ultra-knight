<html>

<head>
    <title>UI Asset Pack Decision Helper</title>
    <link rel="preload" href="spotlight.bundle.js" as="script">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
        }

        #groups button,
        #like-data-controls button {
            background-color: #666666;
            border: 1px solid #888888;
            color: #ffffff;
            cursor: pointer;
            margin: 4px;
            padding: 6px 10px;
        }

        #groups button:hover,
        #like-data-controls button:hover {
            background-color: #808080;
        }

        #like-data-controls {
            margin: 10px;
        }

        #import-cancel-btn {
            display: none;
        }

        #import-textarea {
            background-color: #222222;
            border: 1px solid #888888;
            color: #ffffff;
            display: none;
            margin-top: 8px;
            max-width: 500px;
            width: 100%;
        }

        #import-error {
            color: #ff8080;
            display: none;
            margin-top: 8px;
        }

        #import-error ul {
            margin: 0;
            padding-left: 20px;
        }

        #stats-table {
            border-collapse: collapse;
            margin: 10px;
        }

        #stats-table th,
        #stats-table td {
            border: 1px solid #888888;
            padding: 6px 10px;
            text-align: left;
        }

        #stats-table th {
            background-color: #666666;
        }

        #stats-table a {
            color: #ffffff;
        }

        .spl-like {
            background-image: url(asset/image/svg/heart-outline.svg);
            background-size: 23px;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
            width: 32px;
        }

        .spl-like.on {
            background-image: url(asset/image/svg/heart.svg);
        }

        .spl-gallery-up,
        .spl-gallery-down {
            background-color: rgba(0, 0, 0, 0.45);
            background-image: url("data:image/svg+xml;base64,PHN2ZyBmaWxsPSJub25lIiBoZWlnaHQ9IjI0IiBzdHJva2U9IiNmZmYiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgc3Ryb2tlLXdpZHRoPSIyIiB2aWV3Qm94PSIwIDAgMjQgMjQiIHdpZHRoPSIyNCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cG9seWxpbmUgcG9pbnRzPSIxNSAxOCA5IDEyIDE1IDYiLz48L3N2Zz4=");
            background-position: center;
            background-repeat: no-repeat;
            background-size: 30px;
            border-radius: 100%;
            cursor: pointer;
            height: 50px;
            opacity: 0.65;
            transition: transform 0.35s ease, opacity 0.2s ease;
            width: 50px;
            will-change: transform;
        }

        .spl-gallery-up {
            transform: rotate(90deg);
        }

        .spl-gallery-down {
            transform: rotate(90deg) scaleX(-1);
        }

        .spl-gallery-up:hover,
        .spl-gallery-down:hover {
            opacity: 1;
        }

        #spotlight.white .spl-gallery-up,
        #spotlight.white .spl-gallery-down {
            filter: invert(1);
        }
    </style>
</head>

<body>
    <div id="like-data-controls">
        <button type="button" id="export-likes-btn">Export Likes</button>
        <button type="button" id="import-likes-btn">Import Likes</button>
        <button type="button" id="import-cancel-btn">Cancel</button>
        <textarea id="import-textarea" rows="6" cols="60"></textarea>
        <div id="import-error"></div>
    </div>
    <table id="stats-table">
        <thead>
            <tr>
                <th>Place</th>
                <th>Name</th>
                <th>Liked</th>
                <th>Total</th>
                <th>Percent</th>
            </tr>
        </thead>
        <tbody id="stats-table-body"></tbody>
    </table>
    <div id="groups"></div>
    <script src="spotlight.bundle.js" defer></script>
    <script defer>
        document.addEventListener("DOMContentLoaded", function () {
            var data = {
                "asset_packs": [
                    {
                        "number": 1,
                        "name": "Action RPG Fantasy UI Asset Pack",
                        "url": "https://www.gamedevmarket.net/asset/action-rpg-fantasy-ui-asset-pack"
                    },
                    {
                        "number": 2,
                        "name": "Fantasy RPG UI Asset Pack [Brimlithe]",
                        "url": "https://www.gamedevmarket.net/asset/fantasy-rpg-ui-asset-pack-brimlithe"
                    },
                    {
                        "number": 3,
                        "name": "Dark Fantasy RPG UI Toolkit",
                        "url": "https://www.gamedevmarket.net/asset/dark-fantasy-rpg-ui-toolkit"
                    },
                    {
                        "number": 4,
                        "name": "Fantasy RPG UI Asset Pack [Everdusk]",
                        "url": "https://www.gamedevmarket.net/asset/fantasy-rpg-ui-asset-pack-everdusk-2"
                    },
                    {
                        "number": 5,
                        "name": "Fantasy UI Asset Pack RPG UI Kit [Eternal Legends]",
                        "url": "https://www.gamedevmarket.net/asset/fantasy-ui-asset-pack-eternal-legends-rpg-ui-kit"
                    },
                    {
                        "number": 6,
                        "name": "Fantasy RPG UI Asset Pack [Legend of Azeroth]",
                        "url": "https://www.gamedevmarket.net/asset/fantasy-rpg-ui-asset-pack-legend-of-azeroth"
                    },
                    {
                        "number": 7,
                        "name": "Fantasy RPG UI Asset Pack [Mytherra Realms]",
                        "url": "https://www.gamedevmarket.net/asset/fantasy-rpg-ui-asset-pack-mytherra-realms"
                    },
                    {
                        "number": 8,
                        "name": "Epic Fantasy RPG UI Kit - Ultimate Game Interface Assets",
                        "url": "https://www.gamedevmarket.net/asset/epic-fantasy-rpg-ui-kit-ultimate-game-interface-assets"
                    }
                ],
                "marketing_material_images": [
                    {
                        "prefix": "leaderboard",
                        "suffixes": [1, 7, 4, 6, 2, 5, 3, 8]
                    },
                    {
                        "prefix": "character-select",
                        "suffixes": [1, 4, 6, 7, 3, 2, 5, 8]
                    },
                    {
                        "prefix": "pause-menu",
                        "suffixes": [1, 4, 6, 7, 2, 5, 3, 8]
                    },
                    {
                        "prefix": "general-settings",
                        "suffixes": [1, 4, 6, 7, 2, 5, 3, 8]
                    },
                    {
                        "prefix": "main-menu",
                        "suffixes": [6, 7, 1, 4, 2, 5, 3]
                    },
                    {
                        "prefix": "loading-screen",
                        "suffixes": [1, 2, 4, 6, 7, 3, 5]
                    },
                    {
                        "prefix": "ingame-hud",
                        "suffixes": [1, 6, 7, 4, 2, 5, 3]
                    },
                    {
                        "prefix": "item-shop",
                        "suffixes": [2, "5-2", "8-2", 3, "5-1", "8-1", "8-3"]
                    },
                    {
                        "prefix": "asset-overview",
                        "suffixes": [4, 6, 1, 7, 5, "8-2", "8-1"]
                    },
                    {
                        "prefix": "inventory",
                        "suffixes": [6, 7, 1, 4, 3, 2]
                    },
                    {
                        "prefix": "victory",
                        "suffixes": [1, 4, 6, 7, 2, 5]
                    },
                    {
                        "prefix": "world-map",
                        "suffixes": [1, 4, 6, 7, 3]
                    },
                    {
                        "prefix": "skills",
                        "suffixes": [4, 6, 7, 1, 3]
                    },
                    {
                        "prefix": "crafting",
                        "suffixes": [1, 4, 6, 7, 3]
                    },
                    {
                        "prefix": "codex",
                        "suffixes": [6, 7, 4, 1, 3]
                    },
                    {
                        "prefix": "exit-game",
                        "suffixes": [2, 5, 3]
                    },
                    {
                        "prefix": "roulette",
                        "suffixes": [2, 5]
                    },
                    {
                        "prefix": "battle-pass",
                        "suffixes": [2, 5]
                    },
                    {
                        "prefix": "lobby",
                        "suffixes": [2, 5]
                    },
                    {
                        "prefix": "game-over",
                        "suffixes": [2, 5]
                    },
                    {
                        "prefix": "level-up",
                        "suffixes": [2, 5]
                    },
                    {
                        "prefix": "miscellaneous",
                        "suffixes": ["3-1", "3-2", "8-1", "8-2", "8-3"]
                    }
                ]
            };

            var container = document.getElementById("groups");

            var LIKES_STORAGE_KEY = "spl-liked-images";

            function loadLikedSrcs() {
                try {
                    var stored = JSON.parse(localStorage.getItem(LIKES_STORAGE_KEY));
                    return new Set(Array.isArray(stored) ? stored : []);
                } catch (e) {
                    return new Set();
                }
            }

            function saveLikedSrcs(likedSrcs) {
                localStorage.setItem(LIKES_STORAGE_KEY, JSON.stringify(Array.from(likedSrcs)));
            }

            var likedSrcs = loadLikedSrcs();

            function getAssetPackForSuffix(suffix, assetPacks) {
                var assetPackNumber = Number.parseInt(String(suffix).split("-")[0], 10);
                return assetPacks.find(function (pack) {
                    return pack.number === assetPackNumber;
                });
            }

            function buildGalleries(data) {
                return data.marketing_material_images.map(function (group) {
                    return group.suffixes.map(function (suffix) {
                        var assetPack = getAssetPackForSuffix(suffix, data.asset_packs);
                        var fileKey = group.prefix + "-" + suffix;
                        var src = "asset/image/jpg/" + fileKey + ".jpg";

                        return {
                            src: src,
                            fileKey: fileKey,
                            like: likedSrcs.has(fileKey),
                            assetPackNumber: assetPack ? assetPack.number : null
                        };
                    });
                });
            }

            function buildValidFileKeys(data) {
                var keys = new Set();
                data.marketing_material_images.forEach(function (group) {
                    group.suffixes.forEach(function (suffix) {
                        keys.add(group.prefix + "-" + suffix);
                    });
                });
                return keys;
            }

            var galleries = buildGalleries(data);
            var validFileKeys = buildValidFileKeys(data);

            var statsTableBody = document.getElementById("stats-table-body");

            function computeAssetPackStats() {
                var allItems = galleries.reduce(function (acc, gallery) {
                    return acc.concat(gallery);
                }, []);

                return data.asset_packs.map(function (pack) {
                    var items = allItems.filter(function (item) {
                        return item.assetPackNumber === pack.number;
                    });

                    return {
                        number: pack.number,
                        name: pack.name,
                        url: pack.url,
                        total: items.length,
                        liked: items.filter(function (item) { return item.like; }).length
                    };
                });
            }

            var assetPackStats = computeAssetPackStats();

            function renderStats() {
                // Percent recomputed from live counts, not cached, so re-sort always reflects current state.
                var sorted = assetPackStats.slice().sort(function (a, b) {
                    var percentA = a.total > 0 ? a.liked / a.total : 0;
                    var percentB = b.total > 0 ? b.liked / b.total : 0;

                    if (percentB !== percentA) {
                        return percentB - percentA;
                    }
                    return a.number - b.number;
                });

                statsTableBody.innerHTML = "";

                sorted.forEach(function (stat, index) {
                    var row = document.createElement("tr");

                    var placeCell = document.createElement("td");
                    placeCell.textContent = index + 1;

                    var nameCell = document.createElement("td");
                    var link = document.createElement("a");
                    link.href = stat.url;
                    link.textContent = stat.number + ": " + stat.name;
                    nameCell.appendChild(link);

                    var likedCell = document.createElement("td");
                    likedCell.textContent = stat.liked;

                    var totalCell = document.createElement("td");
                    totalCell.textContent = stat.total;

                    var percentCell = document.createElement("td");
                    var percent = stat.total > 0 ? (stat.liked / stat.total) * 100 : 0;
                    percentCell.textContent = percent.toFixed(1) + "%";

                    row.appendChild(placeCell);
                    row.appendChild(nameCell);
                    row.appendChild(likedCell);
                    row.appendChild(totalCell);
                    row.appendChild(percentCell);

                    statsTableBody.appendChild(row);
                });
            }

            renderStats();

            var exportBtn = document.getElementById("export-likes-btn");
            var importBtn = document.getElementById("import-likes-btn");
            var importCancelBtn = document.getElementById("import-cancel-btn");
            var importTextarea = document.getElementById("import-textarea");
            var importError = document.getElementById("import-error");
            var importAreaOpen = false;

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text);
                }

                // Fallback for contexts without the async Clipboard API (e.g. file://).
                var tempTextarea = document.createElement("textarea");
                tempTextarea.value = text;
                tempTextarea.style.position = "fixed";
                tempTextarea.style.opacity = "0";
                document.body.appendChild(tempTextarea);
                tempTextarea.select();
                document.execCommand("copy");
                document.body.removeChild(tempTextarea);
                return Promise.resolve();
            }

            exportBtn.addEventListener("click", function () {
                var raw = localStorage.getItem(LIKES_STORAGE_KEY) || "[]";
                copyToClipboard(raw).then(function () {
                    var originalText = exportBtn.textContent;
                    exportBtn.textContent = "Copied!";
                    setTimeout(function () {
                        exportBtn.textContent = originalText;
                    }, 1500);
                });
            });

            function showImportError(messages) {
                importError.innerHTML = "";
                var list = document.createElement("ul");
                messages.forEach(function (message) {
                    var listItem = document.createElement("li");
                    listItem.textContent = message;
                    list.appendChild(listItem);
                });
                importError.appendChild(list);
                importError.style.display = "block";
            }

            function hideImportError() {
                importError.style.display = "none";
                importError.innerHTML = "";
            }

            function openImportArea() {
                importAreaOpen = true;
                importTextarea.value = "";
                importTextarea.style.display = "block";
                importCancelBtn.style.display = "inline-block";
                hideImportError();
            }

            function closeImportArea() {
                importAreaOpen = false;
                importTextarea.style.display = "none";
                importCancelBtn.style.display = "none";
                hideImportError();
            }

            function refreshLikeState() {
                galleries.forEach(function (gallery) {
                    gallery.forEach(function (item) {
                        item.like = likedSrcs.has(item.fileKey);
                    });
                });

                assetPackStats = computeAssetPackStats();
                renderStats();
                syncLikeState();
            }

            function attemptImport() {
                var parsed;

                try {
                    parsed = JSON.parse(importTextarea.value);
                } catch (e) {
                    showImportError(["Pasted text is not valid JSON."]);
                    return;
                }

                if (!Array.isArray(parsed)) {
                    showImportError(["Data must be a JSON array."]);
                    return;
                }

                var structureErrors = [];
                parsed.forEach(function (value, index) {
                    if (typeof value !== "string") {
                        structureErrors.push("Item " + index + " (" + JSON.stringify(value) + ") is not a string.");
                    }
                });

                if (structureErrors.length > 0) {
                    showImportError(structureErrors);
                    return;
                }

                var unknownNames = parsed.filter(function (name) {
                    return !validFileKeys.has(name);
                });

                if (unknownNames.length > 0) {
                    showImportError(unknownNames.map(function (name) {
                        return "No matching image for \"" + name + "\".";
                    }));
                    return;
                }

                likedSrcs = new Set(parsed);
                saveLikedSrcs(likedSrcs);
                refreshLikeState();
                closeImportArea();
            }

            importBtn.addEventListener("click", function () {
                if (!importAreaOpen) {
                    openImportArea();
                    return;
                }
                attemptImport();
            });

            importCancelBtn.addEventListener("click", closeImportArea);

            var activeGalleryIndex = 0;
            var slide = 0;
            var controls = {};
            var spotlightOpen = false;

            var controlDefs = [
                { key: "like", handler: toggleLike, label: "Toggle favorite" },
                {
                    key: "gallery-down",
                    handler: function () {
                        showGallery(activeGalleryIndex + 1);
                    },
                    label: "Next gallery"
                },
                {
                    key: "gallery-up",
                    handler: function () {
                        showGallery(activeGalleryIndex - 1);
                    },
                    label: "Previous gallery"
                }
            ];

            function ensureControl(key, handler, label) {
                if (!controls[key]) {
                    var control = Spotlight.addControl(key, handler);
                    control.title = label;
                    control.setAttribute("aria-label", label);
                    controls[key] = control;
                }

                return controls[key];
            }

            function syncLikeState() {
                var likeControl = controls.like;
                if (!likeControl) {
                    return;
                }

                var currentItem = galleries[activeGalleryIndex][slide];
                likeControl.classList.toggle("on", !!(currentItem && currentItem.like));
            }

            function showGallery(galleryIndex, startSlide) {
                activeGalleryIndex = (galleryIndex + galleries.length) % galleries.length;
                slide = startSlide || 0;
                var wasOpen = !!document.querySelector("#spotlight.show");

                Spotlight.show(galleries[activeGalleryIndex], {
                    control: ["page", "fullscreen", "zoom-in", "zoom-out", "close", "prev", "next"],
                    infinite: false,
                    spinner: true,
                    preload: true,
                    autohide: true,
                    fit: "contain",
                    theme: null,
                    animation: [],
                    index: slide + 1,
                    onshow: function () {
                        spotlightOpen = true;

                        controlDefs.forEach(function (def) {
                            ensureControl(def.key, def.handler, def.label);
                        });

                        if (wasOpen) {
                            var currentImage = document.querySelector("#spotlight .spl-pane img");
                            if (currentImage) {
                                currentImage.src = galleries[activeGalleryIndex][slide].src;
                            }
                        }
                    },
                    onchange: function (index) {
                        slide = index - 1;
                        syncLikeState();
                        updateUrlParams();
                    },
                    onclose: function () {
                        spotlightOpen = false;
                        clearUrlParams();

                        if (controls["gallery-down"]) {
                            document.querySelector("#spotlight .spl-header").appendChild(controls["gallery-down"]);
                        }

                        controlDefs.forEach(function (def) {
                            Spotlight.removeControl(def.key);
                            controls[def.key] = null;
                        });
                    }
                });
            }

            function updateUrlParams() {
                var group = data.marketing_material_images[activeGalleryIndex];
                var url = new URL(window.location.href);
                url.searchParams.set("prefix", group.prefix);
                url.searchParams.set("suffix", group.suffixes[slide]);
                // Preserve spotlight's own {spl:...} history state marker, it drives its back-button close handling.
                window.history.replaceState(window.history.state, "", url);
            }

            function clearUrlParams() {
                var url = new URL(window.location.href);
                if (!url.searchParams.has("prefix") && !url.searchParams.has("suffix")) {
                    return;
                }
                url.searchParams.delete("prefix");
                url.searchParams.delete("suffix");
                window.history.replaceState(window.history.state, "", url);
            }

            // Spotlight closes itself via history.go(), which can land back on an older entry
            // (e.g. the original deep-linked URL) that still carries stale prefix/suffix params.
            window.addEventListener("popstate", clearUrlParams);

            // Deep-links open the matching gallery at the matching slide via ?prefix=&suffix=
            function openGalleryFromUrl() {
                var params = new URLSearchParams(window.location.search);
                var prefix = params.get("prefix");
                if (!prefix) {
                    return;
                }

                var galleryIndex = data.marketing_material_images.findIndex(function (group) {
                    return group.prefix === prefix;
                });
                if (galleryIndex === -1) {
                    return;
                }

                var suffixParam = params.get("suffix");
                var suffixes = data.marketing_material_images[galleryIndex].suffixes;
                var slideIndex = suffixes.findIndex(function (suffix) {
                    return String(suffix) === suffixParam;
                });

                showGallery(galleryIndex, slideIndex === -1 ? 0 : slideIndex);
            }

            function toggleLike() {
                var gallery = galleries[activeGalleryIndex];
                var item = gallery[slide];
                item.like = !item.like;

                if (item.like) {
                    likedSrcs.add(item.fileKey);
                } else {
                    likedSrcs.delete(item.fileKey);
                }
                saveLikedSrcs(likedSrcs);

                var stat = assetPackStats.find(function (s) {
                    return s.number === item.assetPackNumber;
                });
                if (stat) {
                    stat.liked += item.like ? 1 : -1;
                    renderStats();
                }

                syncLikeState();
            }

            // Capture phase runs before spotlight's own keydown listener, pre-empting its zoom shortcuts.
            window.addEventListener("keydown", function (event) {
                if (!spotlightOpen) {
                    return;
                }

                if (event.keyCode === 38) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    showGallery(activeGalleryIndex - 1);
                } else if (event.keyCode === 40) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    showGallery(activeGalleryIndex + 1);
                } else if (event.keyCode === 70) {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    toggleLike();
                }
            }, true);

            data.marketing_material_images.forEach(function (group, galleryIndex) {
                var button = document.createElement("button");
                button.type = "button";
                button.textContent = group.prefix;

                button.addEventListener("click", function () {
                    showGallery(galleryIndex);
                });

                container.appendChild(button);
            });

            openGalleryFromUrl();
        });
    </script>
</body>

</html>
